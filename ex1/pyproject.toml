[tool.poetry]
name = "matrix-loading"
version = "0.1.0"
description = "Analyze simulated Matrix data"
authors = ["Student <student@example.com>"]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
numpy = ">=1.25,<3.0"
pandas = ">=2.1,<3.0"
matplotlib = ">=3.7,<4.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
